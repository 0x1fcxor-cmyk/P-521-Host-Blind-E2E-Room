[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p521-host-blind-e2e-room"
version = "0.1.0"
description = "P-521 Host-Blind E2E Room - Secure end-to-end encrypted communication with host-blind relay architecture"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "0x1fcxor-cmyk"}
]
maintainers = [
    {name = "0x1fcxor-cmyk"}
]
keywords = [
    "e2e",
    "encryption",
    "p521",
    "elliptic-curve",
    "cryptography",
    "secure-messaging",
    "host-blind",
    "relay",
    "argon2",
    "aes-gcm"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security :: Cryptography",
    "Topic :: Communications :: Chat",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "websockets>=11.0",
    "cryptography>=41.0",
    "rich>=13.0",
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "argon2-cffi>=21.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/0x1fcxor-cmyk/P-521-Host-Blind-E2E-Room"
Repository = "https://github.com/0x1fcxor-cmyk/P-521-Host-Blind-E2E-Room"
Issues = "https://github.com/0x1fcxor-cmyk/P-521-Host-Blind-E2E-Room/issues"
Documentation = "https://github.com/0x1fcxor-cmyk/P-521-Host-Blind-E2E-Room#readme"

[project.scripts]
p521-room = "main:main"

[tool.setuptools]
packages = [
    "client",
    "core",
    "identity",
    "protocol",
    "relay",
    "storage",
    "transport",
    "web_ui",
]

[tool.setuptools.package-data]
"*" = ["*.py", "*.md", "*.json"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
